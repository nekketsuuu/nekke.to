on:
  workflow_dispatch:
    inputs:
      short_name:
        description: "Short name of the URL"
        required: true
        type: string
      url:
        description: "Destination URL"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}

jobs:
  add_redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
      contents: write
    steps:
      - name: Validate inputs
        # If inputs contain any single quotes...
        if: ${{ contains(inputs.short_name, '''') || contains(inputs.url, '''') }}
        run: |
          echo Invalid input string(s)
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: ruby/setup-ruby@v1
      - name: Update redirects.json
        env:
          SHORT_NAME: ${{ inputs.short_name }}
          URL: ${{ inputs.url }}
        run: |
          ./bin/add "$SHORT_NAME" "$URL"
      - name: Validate if redirects.json is updated
        run: |
          git add --intent-to-add ./redirects.json > /dev/null
          ! git diff --exit-code
      - name: Commit changes, push, and invoke the build
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_NAME: ${{ inputs.short_name }}
        run: |
          # https://api.github.com/users/github-actions%5Bbot%5D
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ./redirects.json
          # TODO: Normalize inputs.short_name (e.g., stripping whitespaces)
          git commit -m "[Bot] Add new path: /${{ env.SHORT_NAME }}"
          git push
          gh workflow run build.yml
